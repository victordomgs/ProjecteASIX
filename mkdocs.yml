site_name: IA en sistemes · 2n ASIX
site_description: Aplicació i desplegament d'IA en sistemes — M0379 Projecte
site_author: "@victordomgs"
repo_url: https://github.com/victordomgs/ProjecteASIX
repo_name: victordomgs/ProjecteASIX
site_url: https://victordomgs.github.io/ProjecteASIX/
copyright: Institut Sabadell · Contingut sota llicència CC BY-SA 4.0

theme:
  name: material
  language: ca
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Mode fosc}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Mode clar}
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - github-callouts
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc: {permalink: true, title: En aquesta pàgina}
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}

nav:
  - Inici: index.md
  - "P0 · Introducció a la IA":
      - p0-introduccio-ia/index.md
      - Fonaments de la IA: p0-introduccio-ia/teoria.md
      - Activitats: p0-introduccio-ia/activitats.md
      - Avaluació: p0-introduccio-ia/avaluacio.md
  - "P1 · Prompt engineering":
      - p1-prompt-engineering/index.md
      - Teoria: p1-prompt-engineering/teoria.md
      - Activitats: p1-prompt-engineering/activitats.md
      - Avaluació: p1-prompt-engineering/avaluacio.md
  - "P2 · Agents amb OpenClaw":
      - p2-openclaw/index.md
      - Teoria: p2-openclaw/teoria.md
      - Activitats: p2-openclaw/activitats.md
      - Avaluació: p2-openclaw/avaluacio.md
  - "P3 · LLMs locals":
      - p3-llms-locals/index.md
      - Teoria: p3-llms-locals/teoria.md
      - Activitats: p3-llms-locals/activitats.md
      - Avaluació: p3-llms-locals/avaluacio.md
  - "P4 · BBDD vectorials":
      - p4-chromadb/index.md
      - Teoria: p4-chromadb/teoria.md
      - Activitats: p4-chromadb/activitats.md
      - Avaluació: p4-chromadb/avaluacio.md
  - "P5 · Anàlisi de logs amb LLM":
      - p5-logs-llm/index.md
      - Teoria: p5-logs-llm/teoria.md
      - Activitats: p5-logs-llm/activitats.md
      - Avaluació: p5-logs-llm/avaluacio.md
  - "P6 · ML al cloud (AzureML)":
      - p6-azureml/index.md
      - Teoria: p6-azureml/teoria.md
      - Activitats: p6-azureml/activitats.md
      - Avaluació: p6-azureml/avaluacio.md
  - Recursos:
      - recursos/index.md
      - Glossari: recursos/glossari.md
      - Entorn: recursos/entorn.md
